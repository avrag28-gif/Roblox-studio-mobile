plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rsm.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rsm.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            minifyEnabled false
        }
    }
}
