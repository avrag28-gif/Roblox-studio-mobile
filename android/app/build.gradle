plugins {
    id 'com.android.application'
}

android {
    def keystorePath = System.getenv("RSM_KEYSTORE_PATH")
    def keystorePassword = System.getenv("RSM_KEYSTORE_PASSWORD")
    def keyAlias = System.getenv("RSM_KEY_ALIAS")
    def keyPassword = System.getenv("RSM_KEY_PASSWORD")

    namespace 'com.rsm.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rsm.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            if (keystorePath && keystorePassword && keyAlias && keyPassword) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            debuggable false
            if (keystorePath && keystorePassword && keyAlias && keyPassword) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
