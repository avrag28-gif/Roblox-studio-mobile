name: Android CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Locate Android SDK tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses >/dev/null || true
      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"
          for attempt in 1 2 3; do
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973"
            "$SDKMANAGER" --install "ndk;27.0.12077973" && break
            test "$attempt" -eq 3 && exit 1
            sleep 3
          done
      - name: Configure and test native engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Android debug build
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Android release build
        working-directory: android
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rsm-android-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
